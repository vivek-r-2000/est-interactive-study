deration."}}, {"id": "18.2", "title": "Natural Resource Asset Accounting (Water, Forest, Minerals)", "eli15_takeaway": "Asset accounting measures the opening volume of a resource, subtracts what humans extracted or destroyed, adds what regenerated, and shows the closing balance.", "bullets": ["Physical Balance Equation: $\\text{Closing Stock} = \\text{Opening Stock} + \\text{Natural Growth} - \\text{Extraction} - \\text{Catastrophic Losses}$.", "Forest Accounts: Total timber volume ($m^3$) and carbon stocks across forest canopy density classes.", "Water Accounts: Inflow (precipitation, river inflow) versus outflow (evapotranspiration, agricultural abstraction, industrial withdrawal)."], "mental_model": "A warehouse inventory check: Count the pallets on Monday morning, subtract what trucks shipped out, add new factory deliveries, and see what is left on Friday.", "checkpoint": {"question": "What is the primary role of a Physical Natural Resource Asset Account?", "options": ["Tracking physical volume changes (opening stock, depletion, natural replenishment, closing stock) of ecological capital over accounting periods", "Printing stock certificates for Wall Street traders", "Replacing physical timber with virtual cryptocurrency tokens", "Measuring the speed of sound through water pipes"], "correct_index": 0, "explanation": "Physical asset accounts track physical quantities ($m^3$, tons, hectares) over time to ensure extraction rates do not exceed replenishment."}}, {"id": "18.3", "title": "Geospatial NRA Integration & Land Use Matrices", "eli15_takeaway": "Natural resource accounting is far more accurate when combined with satellite maps, showing exactly where forests turned into cities and where wetlands dried up.", "bullets": ["Land Use / Land Cover (LULC) Transition Matrix: Cross-tabulating pixel changes between two satellite image dates (e.g. 2015 vs 2025).", "Spatially Explicit Accounting: Overlaying economic concession maps over watershed buffer boundaries.", "Ecosystem Degradation Hotspots: Identifying areas where ecosystem service provision has collapsed due to urban fragmentation."], "mental_model": "A time-lapse satellite map of a town: you see farmland turn into housing subdivisions, and the blue pond turn into a grey concrete parking lot.", "checkpoint": {"question": "What does a Land Use Land Cover (LULC) Transition Matrix display in geospatial environmental accounting?", "options": ["The exact hectare conversions from each land category (e.g., dense forest, farmland, wetland) to other categories across two time periods", "The speed of tectonic plate movement under mountain ranges", "The price of real estate mortgages in city centers", "The number of airplanes landing at national airports"], "correct_index": 0, "explanation": "A transition matrix quantifies how many hectares shifted from one land category to another (e.g., forest converted to agriculture or urban built-up)."}}]}, {"class_id": 19, "title": "Environmental Ethics & Wetland Conservation", "pillar": "Environmental Governance, Law, Accounting & Ethics", "summary": "Philosophical environmental ethics, the Ramsar Convention on Wetlands, wetland ecological criteria, and the 5 recognized wetland classifications.", "submodules": [{"id": "19.1", "title": "Environmental Ethics: Anthropocentrism vs Biocentrism", "eli15_takeaway": "Anthropocentrism says nature only matters if it is useful to humans; Biocentrism says every living creature has a right to live simply because it exists.", "bullets": ["Anthropocentrism: Human-centered ethics. Nature has instrumental value only (resources to exploit or scenery to enjoy).", "Biocentrism: Life-centered ethics. All living organisms have intrinsic moral value, regardless of whether humans find them useful.", "Ecocentrism: Ecosystem-centered ethics (Aldo Leopold's Land Ethic). The entire biotic community (soil, water, plants, animals) has moral standing.", "Intergenerational Justice: Moral obligations to unborn human generations who inherit our environmental consequences."], "mental_model": "A tree in a forest: Anthropocentrism asks 'How much can I sell this lumber for?' Ecocentrism says 'That tree is a home for birds, a sponge for soil water, and has a right to stand.'", "checkpoint": {"question": "What distinguishes Ecocentrism from Anthropocentrism in environmental philosophy?", "options": ["Ecocentrism grants intrinsic moral standing to entire ecological systems (soil, water, species), whereas Anthropocentrism values nature solely for human utility", "Ecocentrism demands that all humans be deported to outer space", "Anthropocentrism states that trees are superior to humans", "There is no difference between the two concepts"], "correct_index": 0, "explanation": "Ecocentrism views humans as plain members of the broader biotic community, granting intrinsic moral rights to ecosystems as integrated wholes."}}, {"id": "19.2", "title": "The Ramsar Convention on Wetlands (1971)", "eli15_takeaway": "Signed in Ramsar, Iran, this international treaty protects wetlands because they act as Earth's natural kidneys (filtering water) and sponges (preventing floods).", "bullets": ["Origin: Ramsar, Iran (1971); the oldest modern global intergovernmental environmental conservation treaty.", "Definition of Wetlands: Areas of marsh, fen, peatland, or water, whether natural or artificial, permanent or temporary, with water that is static or flowing, fresh, brackish, or salt, including marine water up to 6 meters depth at low tide.", "Montreux Record: A register of Ramsar wetland sites where ecological character has changed or is threatened by human pollution or development.", "Wise Use Principle: Sustainable utilization of wetlands for human benefit in ways compatible with maintenance of natural ecosystem properties."], "mental_model": "Earth's kidneys and shock absorbers: wetlands purify toxic water runoff and soak up hurricane storm surges before they hit cities.", "checkpoint": {"question": "Under the Ramsar Convention, what is the maximum depth of marine water at low tide included in the formal definition of a wetland?", "options": ["Six meters", "One hundred meters", "Fifty meters", "One kilometer"], "correct_index": 0, "explanation": "Article 1.1 of the Ramsar Convention includes marine waters where the depth does not exceed six meters at low tide."}}, {"id": "19.3", "title": "The 5 Major Wetland Classifications & Ecosystem Roles", "eli15_takeaway": "Wetlands come in five main flavors: ocean coastlines, river mouths, lakes, rivers, and marshes/swamps, providing nurseries for fish and storing huge amounts of carbon.", "bullets": ["1. Marine Wetlands: Coastal lagoons, rocky shores, coral reefs.", "2. Estuarine Wetlands: Deltas, tidal marshes, mangrove swamps where freshwater rivers meet the sea.", "3. Lacustrine Wetlands: Wetlands associated with permanent lakes.", "4. Riverine Wetlands: Wetlands along rivers and streams (floodplains).", "5. Palustrine Wetlands: Marshes, swamps, bogs, fens with non-flowing water.", "Blue Carbon: Mangroves, salt marshes, and seagrasses bury carbon up to 40x faster than tropical terrestrial rainforests."], "mental_model": "Coastal mangroves: A thick woven bamboo fence standing in water that blunts giant ocean waves and provides a safe kindergarten crib for baby fish.", "checkpoint": {"question": "Which category of wetlands describes deltas, tidal marshes, and mangrove forests where freshwater rivers mix with saline ocean tides?", "options": ["Estuarine Wetlands", "Lacustrine Wetlands", "Riverine Wetlands", "Palustrine Wetlands"], "correct_index": 0, "explanation": "Estuarine wetlands occur at estuaries where rivers meet the sea, characterized by fluctuating tidal salinity gradients (mangroves, deltas, tidal marshes)."}}]}], "case_studies": [{"id": "cs-2070", "name": "Letter Written in Year 2070 (Planetary Dystopia)", "class_id": 1, "pillar": "Planetary Foundations & Human Pressures", "what_happened": "In a projected 2070 dystopia, severe water exhaustion forces human rationing down to half a glass per day. People pay taxes for oxygen (137 m³/day). Severe ozone decay causes 20-year-olds to physically look like 85-year-olds with wrinkled, ulcerated skin and kidney failure. Water tanks require armed military escorts.", "root_cause": "Unchecked consumption of fresh groundwater, complete deforestation of planetary carbon sinks, and atmospheric ozone depletion caused by ignoring mid-20th century ecological warnings.", "takeaway": "Water and air are non-negotiable biological essentials with fixed planetary limits. Once natural hydrological cycles collapse, synthetic technological substitutes (desalination) cannot prevent societal collapse."}, {"id": "cs-easter-island", "name": "The Collapse of Easter Island (Rapa Nui)", "class_id": 2, "pillar": "Planetary Foundations & Human Pressures", "what_happened": "A thriving Polynesian society settled Easter Island ~300 AD with rich palm forests, fertile soils, and seabird colonies. Over centuries, they clear-cut every palm tree on the island for agriculture, timber, and rolling giant Moai stone statues. By 1722, the island was an eroded, treeless wasteland with starving tribal warfare.", "root_cause": "Exceeding the carrying capacity ($K$) of an isolated island ecosystem: deforestation caused rapid topsoil erosion, destroying crop yields, while the loss of timber eliminated ocean canoes, cutting off deep-sea fishing.", "takeaway": "Earth is an isolated island in space. When resource consumption outpaces natural replenishment, civilizational collapse follows inevitably once ecological thresholds are crossed."}, {"id": "cs-baltic-sea", "name": "Baltic Sea Cyanobacteria Bloom (HAB)", "class_id": 2, "pillar": "Planetary Foundations & Human Pressures", "what_happened": "In July 2003, satellite MODIS sensors captured massive swirls of toxic blue-green cyanobacteria (Nodularia) covering tens of thousands of square kilometers across the Baltic Sea, creating dead z     // Initialize Theme
    function initTheme() {
      const savedTheme = localStorage.getItem("est_theme") || "light";
      if (savedTheme === "dark") {
        document.documentElement.classList.add("dark");
        document.documentElement.classList.remove("light");
        themeIcon.textContent = "☀️";
        themeLabel.textContent = "Light";
      } else {
        document.documentElement.classList.add("light");
        document.documentElement.classList.remove("dark");
        themeIcon.textContent = "🌙";
        themeLabel.textContent = "Dark";
      }
    }

    themeToggle.addEventListener("click", () => {
      const isDark = document.documentElement.classList.contains("dark");
      if (isDark) {
        document.documentElement.classList.remove("dark");
        document.documentElement.classList.add("light");
        themeIcon.textContent = "🌙";
        themeLabel.textContent = "Dark";
        localStorage.setItem("est_theme", "light");
      } else {
        document.documentElement.classList.remove("light");
        document.documentElement.classList.add("dark");
        themeIcon.textContent = "☀️";
        themeLabel.textContent = "Light";
        localStorage.setItem("est_theme", "dark");
      }
    });

    // Update Progress
    function updateProgress() {
      const total = DB.metadata.submodules_count || 63;
      const count = completedSubmodules.size;
      const pct = Math.round((count / total) * 100);
      progressFill.style.width = Math.min(100, pct) + "%";
    }

    function toggleSubmoduleCompletion(subId, btn) {
      if (completedSubmodules.has(subId)) {
        completedSubmodules.delete(subId);
        btn.classList.remove("checked");
        btn.innerHTML = "<span>○</span> Mark Complete";
      } else {
        completedSubmodules.add(subId);
        btn.classList.add("checked");
        btn.innerHTML = "<span>✓</span> Completed";
      }
      localStorage.setItem("est_completed_subs", JSON.stringify([...completedSubmodules]));
      updateProgress();
    }

    function triggerKaTeX() {
      if (window.renderMathInElement) {
        renderMathInElement(contentContainer, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\(', right: '\)', display: false},
            {left: '\[', right: '\]', display: true}
          ],
          throwOnError: false
        });
      }
    }

    // Checkpoint Handler
    window.handleCheckpoint = function(subId, selectedIdx, correctIdx, encodedExpl, btn) {
      const safeId = subId.replace('.', '-');
      const container = document.getElementById(`cp-opts-${safeId}`);
      const feedback = document.getElementById(`cp-fb-${safeId}`);
      const expl = decodeURIComponent(encodedExpl);

      const buttons = container.querySelectorAll(".cp-opt");
      buttons.forEach((b, idx) => {
        b.classList.add("disabled");
        if (idx === correctIdx) {
          b.classList.add("correct");
        }
      });

      if (selectedIdx === correctIdx) {
        btn.classList.add("correct");
        feedback.className = "cp-feedback show";
        feedback.style.background = "var(--success-bg)";
        feedback.style.color = "var(--success)";
        feedback.innerHTML = `<strong>✓ Correct!</strong> ${expl}`;
        const card = document.getElementById(`sub-${subId}`);
        if (card) {
          const compBtn = card.querySelector(".btn-complete");
          if (!completedSubmodules.has(subId)) {
            toggleSubmoduleCompletion(subId, compBtn);
          }
        }
      } else {
        btn.classList.add("wrong");
        feedback.className = "cp-feedback show";
        feedback.style.background = "var(--danger-bg)";
        feedback.style.color = "var(--danger)";
        feedback.innerHTML = `<strong>✗ Not quite.</strong> ${expl}`;
      }
    };

        `;
      });
      html += `</div>`;
      contentContainer.innerHTML = html;
      triggerKaTeX();
    }

    // Search Execution
    function handleSearch(q) {
      q = q.trim().toLowerCase();
      if (!q) {
        renderPillarView(currentPillar);
        return;
      }

      currentView = "search";
      classPills.style.display = "none";
      actBar.style.display = "none";
      viewTitle.textContent = `Search Results for "${q}"`;

      let matches = [];
      DB.classes.forEach(c => {
        if (c.submodules) {
          c.submodules.forEach(sub => {
            const textCorpus = (sub.title + " " + sub.eli15_takeaway + " " + sub.bullets.join(" ") + " " + sub.mental_model).toLowerCase();
            if (textCorpus.includes(q)) {
              matches.push({
                type: "submodule",
                class_id: c.class_id,
                class_title: c.title,
                data: sub
              });
            }
          });
        }

        // Also search Class 11 slides
        if (c.slides) {
          c.slides.forEach(slide => {
            const textCorpus = (slide.title + " " + slide.continuity_bridge + " " + slide.eli15_takeaway + " " + slide.key_facts.join(" ") + " " + slide.mental_model).toLowerCase();
            if (textCorpus.includes(q)) {
              matches.push({
                type: "slide",
                class_id: c.class_id,
                class_title: c.title,
                data: slide
              });
            }
          });
        }
      });

      DB.case_studies.forEach(cs => {
        const csCorpus = (cs.name + " " + cs.what_happened + " " + cs.root_cause + " " + cs.takeaway).toLowerCase();
        if (csCorpus.includes(q)) {
          matches.push({
            type: "case_study",
            data: cs
          });
        }
      });

      viewDesc.textContent = `Found ${matches.length} matching item(s) across the course materials.`;

      if (matches.length === 0) {
        contentContainer.innerHTML = `<div style="text-align: center; padding: 60px 20px; color: var(--text-muted);">No results found matching "${q}". Try searching for "carbon", "NDVI", "Aether", "Zelp", "seaweed", "Bhopal", or "EIA".</div>`;
        return;
      }

      let html = `<div class="submodule-grid">`;
      matches.forEach(m => {
        if (m.type === "slide") {
          const s = m.data;
          const slideId = `11.${s.slide_num}`;
          const isDone = completedSubmodules.has(slideId);
          html += `
            <div class="submodule-card" id="sub-${slideId}">
              <div class="card-top">
                <div class="card-badges">
                  <span class="badge-subid">CLASS 11 • SLIDE ${s.slide_num}</span>
                  <span class="badge-act">${s.act.split(':')[0]}</span>
                  <span class="badge-readtime">⚡ 2 min bite</span>
                </div>
                <button class="btn-complete ${isDone ? 'checked' : ''}" onclick="toggleSubmoduleCompletion('${slideId}', this)">
                  <span>${isDone ? '✓' : '○'}</span> ${isDone ? 'Completed' : 'Mark Complete'}
                </button>
              </div>
              <div class="continuity-bridge">
                <span class="bridge-tag">🔗 Continuity</span>
                <span class="bridge-text">${s.continuity_bridge}</span>
              </div>
              <h2 class="submodule-title">${s.title}</h2>
              <div class="callout-eli15">
                <div class="callout-label">ELI15 Core Takeaway</div>
                <div class="callout-text">${s.eli15_takeaway}</div>
              </div>
              <ul class="bullets-list">
                ${s.key_facts.map(f => `<li>${f}</li>`).join('')}
              </ul>
            </div>
          `;
        } else if (m.type === "submodule") {
          const sub = m.data;
          const isDone = completedSubmodules.has(sub.id);
          html += `
            <div class="submodule-card" id="sub-${sub.id}">
              <div class="card-top">
                <div class="card-badges">
                  <span class="badge-subid">CLASS ${m.class_id} • MODULE ${sub.id}</span>
                  <span class="badge-readtime">${m.class_title.split(':')[0]}</span>
                </div>
                <button class="btn-complete ${isDone ? 'checked' : ''}" onclick="toggleSubmoduleCompletion('${sub.id}', this)">
                  <span>${isDone ? '✓' : '○'}</span> ${isDone ? 'Completed' : 'Mark Complete'}
                </button>
              </div>
              <h2 class="submodule-title">${sub.title}</h2>
              <div class="callout-eli15">
                <div class="callout-label">ELI15 Core Takeaway</div>
                <div class="callout-text">${sub.eli15_takeaway}</div>
              </div>
              <ul class="bullets-list">
                ${sub.bullets.map(b => `<li>${b}</li>`).join('')}
              </ul>
            </div>
          `;
        } else if (m.type === "case_study") {
          const cs = m.data;
          html += `
            <div class="submodule-card" style="border-left: 3px solid #C2410C;">
              <span class="badge-subid" style="margin-bottom: 8px; display: inline-block;">CASE STUDY • CLASS ${cs.class_id}</span>
              <h2 class="submodule-title">${cs.name}</h2>
              <p style="font-size: 13px; margin-bottom: 8px;"><strong>What Happened:</strong> ${cs.what_happened}</p>
              <p style="font-size: 13px; margin-bottom: 8px;"><strong>Root Cause:</strong> ${cs.root_cause}</p>
              <p style="font-size: 13px; color: var(--accent);"><strong>Takeaway:</strong> ${cs.takeaway}</p>
            </div>
          `;
        }
      });
      html += `</div>`;
      contentContainer.innerHTML = html;
      triggerKaTeX();
    }

    searchInput.addEventListener("input", (e) => {
      handleSearch(e.target.value);
    });

    // Pillar Navigation Click
    function renderPillarView(pId) {
      currentView = "curriculum";
      currentPillar = pId;
      const pillarObj = DB.pillars.find(p => p.id === currentPillar);
      if (pillarObj && !pillarObj.classes.includes(currentClassId)) {
        currentClassId = pillarObj.classes[0];
      }
      currentActFilter = "ALL";
      renderClassPills();
      renderCurrentClassContent();
    }

    pillarTabs.addEventListener("click", (e) => {
      const tab = e.target.closest(".pillar-tab");
      if (!tab) return;

      document.querySelectorAll(".pillar-tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");

      const pId = tab.dataset.pillar;
      const v = tab.dataset.view;

      if (pId) {
        renderPillarView(parseInt(pId, 10));
      } else if (v === "case-studies") {
        currentView = "case-studies";
        classPills.style.display = "none";
        renderCaseStudies();
      } else if (v === "cheat-sheet") {
        currentView = "cheat-sheet";
        classPills.style.display = "none";
        renderCheatSheet();
      }
    });

    // Boot
    initTheme();
    updateProgress();
    renderClassPills();
    renderCurrentClassContent();
  </script>
</body>
</html>
